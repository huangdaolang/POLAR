[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polar"
version = "0.1.0"
description = "POLAR: policy learning with pretrained belief representations."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/*.txt"]
dependencies = [
  "torch>=2.2",
  "numpy>=1.26",
  "hydra-core>=1.3",
  "omegaconf>=2.3",
  "pydantic>=2.0",
  "einops>=0.7",
  "psutil>=5.9",
  "tqdm>=4.66",
  "matplotlib>=3.8",
  "pandas>=2.1",
  "scikit-learn>=1.6",
  "gpytorch>=1.11",
  "wandb>=0.16",
]

[project.optional-dependencies]
# Required only to build the Dockstring Morgan-fingerprint cache from raw
# SMILES; the prebuilt cache loads without it.
chem = ["rdkit>=2023.9"]
# Optional JIT acceleration for the TabICL quantile utilities. The code falls
# back to a pure-NumPy path when numba is absent.
speedup = ["numba>=0.59"]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
  "mypy>=1.8",
  "ipykernel>=7.2.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"polar.backbones.tabpfn.model.base" = ["tabpfn_col_embedding.pt"]

[tool.ruff]
line-length = 100
target-version = "py310"
